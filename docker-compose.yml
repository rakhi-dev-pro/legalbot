services:

  # ============================================================
  # 1. NGINX - Reverse Proxy / HTTPS
  # ============================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: legalbot_proxy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started


  # ============================================================
  # 2. POSTGRESQL + PGVECTOR
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legalbot_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legalbot}
      POSTGRES_USER: ${POSTGRES_USER:-legal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalbot_secure_pass_2026}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-legal_admin} -d ${POSTGRES_DB:-legalbot}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # 3. REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: legalbot_redis
    restart: unless-stopped

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ============================================================
  # 4. LLM MODEL DOWNLOADER
  #
  # Downloads the GGUF only if it doesn't already exist.
  # The model is stored in ./models on the Codespace host.
  #
  # This container exits successfully after downloading.
  # ============================================================
  llm-model:
    image: alpine:3.20
    container_name: legalbot_llm_model

    restart: "no"

    environment:
      LLM_MODEL_FILE: ${LLM_MODEL_FILE:-granite-4.2-3b-Q4_K_M.gguf}

      HF_DOWNLOAD_URL: ${HF_DOWNLOAD_URL:-https://huggingface.co/ibm-granite/granite-4.2-3b-GGUF/resolve/main/granite-4.2-3b-Q4_K_M.gguf?download=true}

    volumes:
      - ./models:/models

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo ""
        echo "=============================================="
        echo " LegalBot - LLM Model Downloader"
        echo "=============================================="
        echo ""

        MODEL="/models/$${LLM_MODEL_FILE}"
        TEMP="$${MODEL}.download"

        echo "Model file:"
        echo "$${MODEL}"
        echo ""

        mkdir -p /models

        # --------------------------------------------------------
        # Model already exists
        # --------------------------------------------------------
        if [ -f "$${MODEL}" ] && [ -s "$${MODEL}" ]; then

          echo "[LLM] Model already exists."
          echo ""
          ls -lh "$${MODEL}"

          echo ""
          echo "[LLM] Skipping download."

          exit 0
        fi

        # --------------------------------------------------------
        # Download model
        # --------------------------------------------------------
        echo "[LLM] Model not found."
        echo "[LLM] Starting download..."
        echo ""
        echo "URL:"
        echo "$${HF_DOWNLOAD_URL}"
        echo ""

        rm -f "$${TEMP}"

        apk add --no-cache curl ca-certificates

        echo ""
        echo "[LLM] Downloading..."
        echo ""

        curl \
          --fail \
          --location \
          --retry 5 \
          --retry-delay 5 \
          --connect-timeout 30 \
          --max-time 7200 \
          --progress-bar \
          --output "$${TEMP}" \
          "$${HF_DOWNLOAD_URL}"

        # --------------------------------------------------------
        # Verify download
        # --------------------------------------------------------
        echo ""
        echo "[LLM] Verifying downloaded file..."

        if [ ! -f "$${TEMP}" ]; then
          echo "[LLM] ERROR: Downloaded file does not exist."
          exit 1
        fi

        if [ ! -s "$${TEMP}" ]; then
          echo "[LLM] ERROR: Downloaded file is empty."
          rm -f "$${TEMP}"
          exit 1
        fi

        # --------------------------------------------------------
        # Atomically move into place
        # --------------------------------------------------------
        mv "$${TEMP}" "$${MODEL}"

        echo ""
        echo "=============================================="
        echo " Model download complete"
        echo "=============================================="
        echo ""

        ls -lh "$${MODEL}"

        echo ""
        echo "[LLM] Model is ready."


  # ============================================================
  # 5. LLAMA.CPP SERVER
  #
  # Starts ONLY after llm-model has successfully completed.
  # ============================================================
  llm-service:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: legalbot_llm
    restart: unless-stopped

    depends_on:
      llm-model:
        condition: service_completed_successfully

    volumes:
      - ./models:/models:ro

    environment:
      LLM_MODEL_FILE: ${LLM_MODEL_FILE:-granite-4.2-3b-Q4_K_M.gguf}
      LLM_CTX_SIZE: ${LLM_CTX_SIZE:-4096}

    command:
      - --model
      - /models/${LLM_MODEL_FILE:-granite-4.2-3b-Q4_K_M.gguf}

      - --host
      - 0.0.0.0

      - --port
      - "8080"

      - --ctx-size
      - "${LLM_CTX_SIZE:-4096}"


  # ============================================================
  # 6. BACKEND - FastAPI
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: legalbot_backend
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legal_admin}:${POSTGRES_PASSWORD:-legalbot_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-legalbot}

      REDIS_URL: redis://redis:6379/0

      LLAMA_CPP_URL: http://llm-service:8080

      LLM_MODEL_FILE: ${LLM_MODEL_FILE:-granite-4.2-3b-Q4_K_M.gguf}

      SECRET_KEY: ${SECRET_KEY:-super_secret_legalbot_jwt_key}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      llm-service:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ============================================================
  # 7. FRONTEND - React + Vite
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: legalbot_frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: https://localhost

    depends_on:
      backend:
        condition: service_healthy


# ==============================================================
# PERSISTENT VOLUMES
# ==============================================================

volumes:
  pgdata:
  redisdata: